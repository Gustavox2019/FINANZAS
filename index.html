<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Dinero</title>
  <meta name="description" content="Dashboard personal de finanzas: ingresos, gastos, presupuestos, tarjetas de crédito y cuentas." />

  <!-- Tailwind (vía CDN, sin paso de build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel standalone: transforma el JSX de app.js directamente en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <!-- Firebase (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #f5f5f4;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #root { min-height: 100vh; padding: 16px; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#a8a29e;font-size:14px;">
      Cargando…
    </div>
  </div>

  <!-- Tu app: JSX transformado en vivo por Babel, sin paso de compilación -->
  <!-- El "?v=2" evita que el navegador o el CDN sirvan una copia vieja en caché al actualizar app.js -->
  <script type="text/babel" data-presets="react" src="app.js?v=2"></script>
</body>
</html>
